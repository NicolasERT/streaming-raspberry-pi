<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TV Streaming</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <main class="layout">
    <header class="header">
      <h1>TV Streaming</h1>
      <div class="status-wrap">
        <span id="status-dot" class="status-dot is-unknown" aria-hidden="true"></span>
        <span id="status-text">Estado: consultando...</span>
      </div>
    </header>

    <div class="content-layout">
      <section class="player-column" aria-label="Reproductor y estado">
        <section class="player-section" aria-label="Reproductor">
          <iframe
            id="stream-frame"
            class="stream-frame"
            title="Stream TV"
            src="about:blank"
            allow="autoplay"
            allowfullscreen>
          </iframe>
        </section>
      </section>

      <aside id="controls-panel" class="controls-panel" aria-label="Controles">
        <div id="controls-body" class="controls-body">
          <div class="remote-system">
            <button id="btn-start" class="btn btn-start" type="button">Iniciar servicio</button>
            <button id="btn-stop" class="btn btn-stop" type="button">Detener servicio</button>
          </div>

          <div class="remote-extra">
            <button id="btn-scene-guide" class="btn btn-aux" type="button">Guia</button>
            <button id="btn-scene-language" class="btn btn-aux" type="button">Idioma</button>
            <button id="btn-scene-subtitle" class="btn btn-aux" type="button">Subtitulo</button>
          </div>

          <div class="remote-channel">
            <button id="btn-ch-up" class="btn btn-ch" type="button">Canal ▲</button>
            <button id="btn-ch-down" class="btn btn-ch" type="button">Canal ▼</button>
          </div>

          <section class="remote-pad" aria-label="Control direccional">
            <button id="btn-scene-up" class="btn btn-remote" type="button">▲</button>
            <button id="btn-scene-left" class="btn btn-remote" type="button">◀</button>
            <button id="btn-scene-ok" class="btn btn-ok" type="button">OK</button>
            <button id="btn-scene-right" class="btn btn-remote" type="button">▶</button>
            <button id="btn-scene-down" class="btn btn-remote" type="button">▼</button>
          </section>

          <div class="remote-resolution">
            <select id="resolution-select" class="resolution-select" aria-label="Seleccionar resolución">
              <option value="1920x1080|60">1080p @ 60 FPS</option>
              <option value="1280x720|30">720p @ 30 FPS</option>
              <option value="854x480|30">480p @ 30 FPS</option>
            </select>
          </div>

          <section class="feedback" aria-live="polite">
            <p id="message" class="message is-muted">Listo.</p>
          </section>
        </div>
      </aside>
    </div>
  </main>

  <script src="../base1/cockpit.js"></script>
  <script src="app.js"></script>
</body>
</html>
